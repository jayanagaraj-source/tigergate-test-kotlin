# TigerGate security scan.
#
# Runs the TigerGate CLI container against this repository and uploads the
# results to the TigerGate staging environment.
#
# The CLI image is fully driven by workflow inputs (cli_image / cli_tag), so a
# custom or private build can be tested later by dispatching with different
# values -- no edit to this file required.
#
# This repository is a deliberately vulnerable Kotlin/Gradle fixture (see
# SECURITY_FIXTURES.md) and ships its own ground truth there, so the summary step
# below prints the expected counts next to whatever the scan reported.
name: TigerGate Security Scan

on:
  workflow_dispatch:
    inputs:
      cli_image:
        description: "TigerGate CLI image (without tag)"
        type: string
        required: true
        default: tigergate/tigergate-cli
      cli_tag:
        description: "TigerGate CLI image tag"
        type: string
        required: true
        default: latest
      scan_type:
        description: "Scan type to run"
        type: choice
        required: true
        default: all
        options:
          - all
          - sast
          - sca
          - secrets
          - iac
      quality_gate:
        description: "Enforce the quality gate (fails the job when the gate fails)"
        type: boolean
        required: true
        default: false
      resolve_deps:
        description: "Resolve the Gradle graph and regenerate the SBOM before scanning"
        type: boolean
        required: true
        default: true
      fail_on_empty_sca:
        description: "Fail the job if Gradle dependency resolution yields no packages (prevents silent zero-coverage SCA)"
        type: boolean
        required: true
        default: true

permissions:
  contents: read
  statuses: write
  pull-requests: write

jobs:
  scan:
    name: TigerGate ${{ inputs.scan_type }} scan
    runs-on: ubuntu-latest

    # The whole job runs inside the selected TigerGate CLI image.
    container:
      image: ${{ inputs.cli_image }}:${{ inputs.cli_tag }}
      # The image declares ENTRYPOINT ["tigergate"]. GitHub Actions overrides the
      # entrypoint itself to keep the container alive and then execs each step in
      # a shell, so no `options: --entrypoint` override is needed here.

    env:
      TIGERGATE_API_KEY: ${{ secrets.TIGERGATE_API_KEY }}
      TIGERGATE_API_URL: https://api.staging.tigergate.dev
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Keep the Gradle home inside the workspace so it survives between steps and
      # can be cached; the wrapper downloads the distribution here on first use.
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-home
      # A daemon inside a short-lived container is pure overhead and can be OOM-killed.
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx1g

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the scanner reads git metadata, and --scan-scope full
          # plus any diff/baseline logic needs more than a shallow clone.
          fetch-depth: 0

      - name: Configure git safe.directory
        # The container runs as root while the workspace is checked out by the
        # runner user, so git refuses to operate on it ("dubious ownership")
        # until the path is explicitly trusted.
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory '*'
          git -C "$GITHUB_WORKSPACE" rev-parse --short HEAD

      - name: TigerGate CLI version
        # Printed before the scan so the exact CLI build under test is recorded
        # in the job log.
        run: tigergate --version

      - name: Provision JDK toolchain for Gradle resolution
        # The public tigergate-cli image may ship no JVM. gradle.lockfile and
        # sbom/bom.json are committed, so lockfile-based SCA works regardless --
        # but a CLI that shells out to `gradle dependencies` to resolve the graph
        # degrades to parsing build.gradle.kts as text, which finds the 15 direct
        # dependencies and misses every transitive one.
        #
        # Skipped automatically when the selected image already carries a JDK, so a
        # custom cli_image needs no change to this workflow.
        if: contains(fromJSON('["all","sca"]'), inputs.scan_type)
        run: |
          set -e
          if command -v java >/dev/null 2>&1; then
            echo "JDK already present in the image; skipping install."
            java -version 2>&1 | head -1
            exit 0
          fi

          if command -v apt-get >/dev/null 2>&1; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            # headless JDK is enough: nothing here needs AWT/Swing.
            apt-get install -y -qq --no-install-recommends openjdk-17-jdk-headless ca-certificates git || \
              apt-get install -y -qq --no-install-recommends default-jdk-headless ca-certificates git
          elif command -v apk >/dev/null 2>&1; then
            apk add --no-cache openjdk17-jdk ca-certificates git
          else
            echo "::warning::No JVM and no apt-get or apk in this image - SCA will fall back to static build-file parsing and under-report transitive dependencies."
            exit 0
          fi

          command -v java >/dev/null 2>&1 || exit 0
          java -version 2>&1 | head -1

      - name: Resolve Gradle dependencies
        id: resolve
        # Optional but on by default: materialises the full dependency graph and
        # refreshes the CycloneDX SBOM so scanners that read either one see the
        # transitive closure rather than just the declared coordinates.
        #
        # NOTE (regression guard): build.gradle.kts deliberately does NOT pin a
        # jvmToolchain. A hard pin makes resolution of runtimeClasspath fail on any
        # runner without that exact JDK -- "Cannot find a Java installation ...
        # matching {languageVersion=17}" -- and a failed `gradle dependencies` run
        # produces the same empty package list as a project with no dependencies.
        # Dependency locking is likewise opt-in (-PstrictLocks=true) so lock drift
        # cannot fail a scan either.
        if: ${{ inputs.resolve_deps && contains(fromJSON('["all","sca"]'), inputs.scan_type) }}
        continue-on-error: true
        run: |
          set -o pipefail
          if ! command -v java >/dev/null 2>&1; then
            echo "::warning::No JVM available - skipping resolution; the scan will rely on gradle.lockfile and sbom/bom.json."
            echo "modules=0" >> "$GITHUB_OUTPUT"
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          chmod +x ./gradlew || true

          # --write-locks keeps gradle.lockfile in step with whatever this runner
          # resolves; drop it if you want the committed lock state to be authoritative.
          ./gradlew --no-daemon --stacktrace \
            dependencies --configuration runtimeClasspath \
            2>&1 | tee /tmp/gradle-deps.log
          RESOLVE_RC=$?

          # Count the modules Gradle actually printed. Zero here is the failure mode
          # this step exists to catch: the scan would otherwise report clean SCA.
          MODULES=$(grep -cE '^[+\\]---' /tmp/gradle-deps.log || true)
          echo "modules=$MODULES" >> "$GITHUB_OUTPUT"

          if [ "$RESOLVE_RC" -ne 0 ] || [ "$MODULES" -eq 0 ]; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "::error title=Gradle dependency resolution failed::No dependency graph was produced (exit $RESOLVE_RC, $MODULES modules). Java dependencies will be absent from the SBOM and receive no vulnerability coverage."
            sed -n '/What went wrong/,/^\* Try/p' /tmp/gradle-deps.log | head -30
            exit 0
          fi

          echo "status=ok" >> "$GITHUB_OUTPUT"
          echo "resolved $MODULES direct modules on the runtime classpath"

          # Refresh the SBOM from this runner's resolution.
          ./gradlew --no-daemon cyclonedxBom 2>&1 | tail -5 || \
            echo "::warning::cyclonedxBom failed - the committed sbom/bom.json will be scanned instead."

      - name: Run TigerGate scan
        id: scan
        run: |
          set -o pipefail
          tigergate scan \
            --type "${{ inputs.scan_type }}" \
            --scan-scope full \
            --upload \
            --quality-gate=${{ inputs.quality_gate }} \
            2>&1 | tee /tmp/tigergate-scan.log

      - name: Scan result
        if: always()
        env:
          CLI_IMAGE: ${{ inputs.cli_image }}
          CLI_TAG: ${{ inputs.cli_tag }}
          SCAN_TYPE: ${{ inputs.scan_type }}
          QUALITY_GATE: ${{ inputs.quality_gate }}
          RESOLVE_DEPS: ${{ inputs.resolve_deps }}
          RESOLVE_STATUS: ${{ steps.resolve.outputs.status }}
          RESOLVE_MODULES: ${{ steps.resolve.outputs.modules }}
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
        run: |
          LOG=/tmp/tigergate-scan.log

          # Resolve one reported value. Uses the scan step's output first (for CLI
          # builds that write to $GITHUB_OUTPUT), otherwise scans the captured log
          # for the given label patterns. mode controls how the value is cut out of
          # the matched text: num = trailing integer, url = the URL itself (never
          # split on its own ":"), str = whatever follows the label separator.
          extract() {
            mode="$1"; preset="$2"; shift 2
            if [ -n "$preset" ]; then printf '%s\n' "$preset"; return; fi
            [ -f "$LOG" ] || { echo "n/a"; return; }
            for pat in "$@"; do
              m=$(grep -aioE "$pat" "$LOG" | tail -1)
              [ -n "$m" ] || continue
              case "$mode" in
                num) v=$(printf '%s' "$m" | grep -oE '[0-9]+' | tail -1) ;;
                url) v=$(printf '%s' "$m" | grep -oE 'https?://[^[:space:]"]+') ;;
                *)   v=$(printf '%s' "$m" | sed -E 's/.*[:=][[:space:]]*//') ;;
              esac
              v=$(printf '%s' "$v" | sed -E 's/\x1b\[[0-9;]*m//g; s/^[[:space:]]+//; s/[[:space:]]+$//')
              [ -n "$v" ] && { printf '%s\n' "$v"; return; }
            done
            echo "n/a"
          }

          SCAN_ID=$(extract  str "${{ steps.scan.outputs.scan_id }}"        'scan[ _-]?id[^A-Za-z0-9]{1,4}[A-Za-z0-9_-]+')
          GATE=$(extract     str "${{ steps.scan.outputs.gate_status }}"    'quality[ _-]?gate[^:=]*[:=][[:space:]]*[A-Za-z]+' 'gate[ _-]?status[:=][[:space:]]*[A-Za-z]+')
          TOTAL=$(extract    num "${{ steps.scan.outputs.total_findings }}" 'total[ _-]?findings[^0-9]{0,10}[0-9]+' 'total[^0-9a-z]{1,10}[0-9]+')
          CRITICAL=$(extract num "${{ steps.scan.outputs.critical_count }}" 'critical[^0-9a-z]{0,10}[0-9]+')
          HIGH=$(extract     num "${{ steps.scan.outputs.high_count }}"     'high[^0-9a-z]{0,10}[0-9]+')
          URL=$(extract      url "${{ steps.scan.outputs.dashboard_url }}"  'https?://[^[:space:]"]*(scan|finding|dashboard|report)[^[:space:]"]*')

          # Fixture-specific: SBOM component count and per-category findings, so the
          # numbers can be compared against SECURITY_FIXTURES.md without leaving the run.
          # Each category tries a labelled pattern first, then a looser one. The
          # loose form allows a word ("findings", "issues") between label and
          # number, so it must not use [^0-9a-z] -- under grep -i that class
          # excludes letters in both cases and would never span "SAST findings: 5".
          SBOM=$(extract     num "${{ steps.scan.outputs.sbom_components }}" '[0-9]+[[:space:]]+(components|packages)[[:space:]]+(detected|found)' 'sbom[^0-9]{0,20}[0-9]+' 'components[^0-9]{0,10}[0-9]+')
          SAST=$(extract     num ""                                          'sast[^0-9]{0,4}(findings|issues|results)[^0-9]{0,10}[0-9]+' 'sast[^0-9]{0,20}[0-9]+')
          SCA=$(extract      num ""                                          'sca[^0-9]{0,4}(findings|issues|results)[^0-9]{0,10}[0-9]+' '\bsca\b[^0-9]{0,20}[0-9]+')
          SECRETS=$(extract  num ""                                          'secrets?[^0-9]{0,4}(findings|issues|results|detected)[^0-9]{0,10}[0-9]+' '\bsecrets?\b[^0-9]{0,20}[0-9]+')
          IAC=$(extract      num ""                                          'iac[^0-9]{0,4}(findings|issues|results)[^0-9]{0,10}[0-9]+' '\biac\b[^0-9]{0,20}[0-9]+')

          {
            echo "## TigerGate scan result"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| CLI image | \`$CLI_IMAGE:$CLI_TAG\` |"
            echo "| Scan type | \`$SCAN_TYPE\` |"
            echo "| Quality gate enforced | \`$QUALITY_GATE\` |"
            echo "| Dependencies resolved | \`$RESOLVE_DEPS\` (status: \`${RESOLVE_STATUS:-n/a}\`, ${RESOLVE_MODULES:-n/a} modules) |"
            echo "| Scan outcome | \`$SCAN_OUTCOME\` |"
            echo "| Scan ID | $SCAN_ID |"
            echo "| Gate status | $GATE |"
            echo "| Total findings | $TOTAL |"
            echo "| Critical | $CRITICAL |"
            echo "| High | $HIGH |"
            echo "| Dashboard / findings URL | $URL |"
          } | tee -a "$GITHUB_STEP_SUMMARY"

          # Ground truth lives in the repo, so detection gaps are visible in the run
          # itself rather than only on the dashboard. Counts are derived from source,
          # not hardcoded, so they stay correct as fixtures are added. Plain shell --
          # the CLI image is not assumed to carry node, python or jq.
          EXP_SAST=$(find src/main/kotlin -name '*.kt' 2>/dev/null | wc -l | tr -d ' ')
          EXP_CWE=$(grep -rhoE 'CWE-[0-9]+' src/main/kotlin scripts 2>/dev/null | sort -u | wc -l | tr -d ' ')
          EXP_SCA=$(grep -cE '^\s*(implementation|testImplementation|compileOnly)\(' build.gradle.kts 2>/dev/null | tr -d ' ')
          EXP_LOCK=$(grep -E '^[^#].*=' gradle.lockfile 2>/dev/null | grep -vcE '^empty=' | tr -d ' ')
          EXP_CVE=$(grep -rhoE 'CVE-[0-9]{4}-[0-9]+' build.gradle.kts SECURITY_FIXTURES.md 2>/dev/null | sort -u | wc -l | tr -d ' ')
          EXP_SBOM=$(grep -oE '"bom-ref"' sbom/bom.json 2>/dev/null | wc -l | tr -d ' ')
          EXP_TF=$(find terraform -name '*.tf' 2>/dev/null | wc -l | tr -d ' ')
          EXP_TFRES=$(grep -chE '^resource ' terraform/*.tf 2>/dev/null | awk '{s+=$1} END {print s+0}')
          EXP_K8S=$(find kubernetes -name '*.yaml' 2>/dev/null | wc -l | tr -d ' ')
          EXP_SECFILES=$(ls .env config/secrets.yaml config/*.pem config/fixture_deploy_key config/gcp-service-account.json src/main/resources/application.properties scripts/deploy.sh 2>/dev/null | wc -l | tr -d ' ')

          {
            echo
            echo "### Reported vs expected (fixture ground truth)"
            echo
            echo "| Category | Reported | Expected | Source |"
            echo "|---|---|---|---|"
            echo "| SAST | $SAST | $EXP_SAST Kotlin files, $EXP_CWE distinct CWEs | \`src/main/kotlin/**\` |"
            echo "| Secrets | $SECRETS | $EXP_SECFILES seeded files (~35 credentials) | \`.env\`, \`config/\`, \`scripts/\` |"
            echo "| IaC | $IAC | $EXP_TF Terraform files ($EXP_TFRES resources), $EXP_K8S K8s manifests, 1 CFN stack | \`terraform/\`, \`kubernetes/\`, \`cloudformation/\` |"
            echo "| SCA | $SCA | $EXP_SCA declared deps, $EXP_LOCK locked modules, $EXP_CVE documented CVEs | \`build.gradle.kts\`, \`gradle.lockfile\` |"
            echo "| SBOM components | $SBOM | $EXP_SBOM | \`sbom/bom.json\` (CycloneDX 1.5) |"
            echo
            echo "Docker/Compose/CI fixtures (\`Dockerfile\`, \`docker-compose.yml\`, \`.github/workflows/insecure-ci.yml\`) are additional IaC surface."
            echo "Known gap: a scanner that only parses \`build.gradle.kts\` sees $EXP_SCA declared coordinates and misses the transitive closure in \`gradle.lockfile\` ($EXP_LOCK)."
            echo
            echo "Full scoring guide: [SECURITY_FIXTURES.md]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/SECURITY_FIXTURES.md)"
          } | tee -a "$GITHUB_STEP_SUMMARY"

          # Zero-coverage guard: a clean SCA result on this repo is always wrong.
          if [ "${RESOLVE_STATUS:-}" = "failed" ]; then
            {
              echo
              echo "> [!WARNING]"
              echo "> Gradle dependency resolution failed on this runner, so Java dependencies are absent"
              echo "> from the SBOM and received no vulnerability coverage. Any SCA number above is unreliable."
              echo "> Gradle's own error is in the \`Resolve Gradle dependencies\` step log."
            } | tee -a "$GITHUB_STEP_SUMMARY"
          fi

          # The value extraction above is best-effort: if this CLI build labels
          # its summary differently, the fields read "n/a" and the raw output
          # below is the source of truth.
          echo
          echo "----- raw CLI output (last 100 lines) -----"
          if [ -f "$LOG" ]; then tail -100 "$LOG"; else echo "no scan log produced"; fi

      - name: Fail on zero-coverage SCA
        # Separate from the summary so the run is red, not quietly green, when the
        # dependency graph never materialised. Opt out with fail_on_empty_sca=false.
        if: ${{ always() && inputs.fail_on_empty_sca && steps.resolve.outputs.status == 'failed' }}
        run: |
          echo "::error title=Zero-coverage SCA::Gradle resolution produced no packages; this fixture has $(grep -E '^[^#].*=' gradle.lockfile | grep -vcE '^empty=') locked modules and must never scan clean."
          exit 1

      - name: Upload scan log
        # Kept as an artifact so a run can be compared against SECURITY_FIXTURES.md
        # after the fact, and so failed extractions can be debugged from full output.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tigergate-scan-${{ inputs.scan_type }}-${{ github.run_id }}
          path: |
            /tmp/tigergate-scan.log
            /tmp/gradle-deps.log
            sbom/
          if-no-files-found: warn
          retention-days: 14
