            - name: GITHUB_TOKEN
              value: "ghp_hvGQfZzrTul83lLuOF8Vmk2SDtDrj2O61LUA"
          ports:
            - containerPort: 8080
              hostPort: 8080
          volumeMounts:
            - name: host-root
              mountPath: /host
            - name: docker-sock
              mountPath: /var/run/docker.sock
          # no resources.limits / requests, no liveness / readiness probes
