apiVersion: v1
kind: Service
metadata:
  name: tigergate-test-kotlin
  namespace: default
spec:
  type: NodePort
  selector: { app: tigergate-test-kotlin }
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: tigergate-lb
  namespace: default
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  selector: { app: tigergate-test-kotlin }
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tigergate-test-kotlin
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
spec:
  rules:
    - host: "*.tigergate.example"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tigergate-test-kotlin
                port: { number: 8080 }
  # no tls block
